config_version: "1.0.0"
random_seed: 20260728
candidate_provenance: generated_from_authorised_train
validation_mode: strict
sampling:
  maximum_rows_per_role: 10000
  method: uniform_without_replacement
  batch_size: 16384
  memory_limit_mb: 1024
  dependency_maximum_rows: 8000
  propensity_maximum_rows_per_class: 6000
  utility_maximum_rows_per_role: 8000
  privacy_maximum_rows_per_role: 1000
  record_index_digest: true
continuous:
  quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
  histogram_bins: auto_fd
  maximum_histogram_bins: 60
  normalisation: holdout_iqr
categorical:
  top_k: 20
dependency:
  mutual_information_pairs:
    - [duration_seconds, route_distance_m]
    - [origin_zone, destination_zone]
  numeric_bin_count: 10
  propensity_iterations: 200
  propensity_learning_rate: 0.1
utility:
  include_trts_diagnostic: true
  classifier: nearest_centroid
  tasks:
    - name: distance_band_from_context
      target: distance_band
      type: classification
      features: [origin_zone, destination_zone, hour_of_day, day_of_week, payment_type]
      minimum_class_count: 20
privacy:
  nearest_neighbour_chunk_size: 128
  rare_combination_maximum_count: 10
  attribute_inference_tasks: []
transport:
  top_k_od: 20
  minimum_released_od_count: 10
  speed_consistency_relative_tolerance: 0.000001
  impossible_speed_threshold_kph: 160.0
uncertainty:
  bootstrap_repetitions: 0
  confidence_level: 0.95
  bootstrap_seed: 20260729
reporting:
  include_feature_level_results: true
  include_not_applicable: true
  write_row_level_data: false
  forbidden_output_path_components: [restricted, raw, source_data, vehicle_tokens]
  suppress_low_count_labels: true
  release_minimum_cell_count: 10
